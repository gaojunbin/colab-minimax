<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>{% block title %}MiniMax H3{% endblock %}</title>
  <style>
{% include "partials/css/tokens.css" %}
{% include "partials/css/components.css" %}
{% block styles %}{% endblock %}
  </style>
</head>
<body>
{% include "partials/icons.svg" %}
{% block nav %}
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="brand" href="/_control/dashboard" aria-label="MiniMax H3 控制台">
        <span class="brand-mark" aria-hidden="true">H3</span>
        <span class="brand-name">MiniMax H3</span>
      </a>
      <nav class="nav-links" aria-label="主导航">
        <a class="nav-link" href="/_control/dashboard"{% if active_nav == 'dashboard' %} aria-current="page"{% endif %}>控制台</a>
        <a class="nav-link" href="/_control/integration"{% if active_nav == 'integration' %} aria-current="page"{% endif %}>接入文档</a>
      </nav>
      <div class="nav-actions">
        {% block nav_actions %}{% endblock %}
        <a class="icon-btn" href="/_control/logout" aria-label="退出登录" title="退出登录">
          <svg class="i"><use href="#i-logout"/></svg>
        </a>
      </div>
    </div>
  </header>
{% endblock %}
{% block content %}{% endblock %}
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast-icon" aria-hidden="true">
      <svg class="i i-ok"><use href="#i-check"/></svg>
      <svg class="i i-err"><use href="#i-alert"/></svg>
    </span>
    <span id="toast-text"></span>
  </div>
  <script>
{% include "partials/js/common.js" %}
  </script>
{% block scripts %}{% endblock %}
</body>
</html>
